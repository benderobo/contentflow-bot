server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects must stay relative: behind a TLS-terminating proxy an absolute
    # Location would be built with this server's own scheme and port.
    absolute_redirect off;

    # Cache static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The app is also opened under /app/ (BotFather menu button, API mount at /app).
    # The build uses relative asset paths, so serve the same files under that prefix.
    # ^~ keeps the static-file regex above from catching /app/static/... first.
    location = /app {
        return 301 /app/$is_args$args;
    }
    location ^~ /app/ {
        rewrite ^/app/(.*)$ /$1 last;
    }

    # Fallback to index.html for SPA. index.html must never be served from a client
    # cache: it names the hashed bundle files, so a stale copy pins an old release
    # (Telegram's webview caches it heuristically for hours otherwise).
    # add_header in a location replaces the server-level ones, so they are repeated.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
