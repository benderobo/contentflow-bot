<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IN_SITE — Админ</title>
<style>
  :root {
    --bg: #0f0f13; --surface: #1a1a24; --surface2: #22222f;
    --border: #2e2e3e; --accent: #7c6af7; --accent2: #a78bfa;
    --text: #e8e8f0; --muted: #6b6b85;
    --success: #34d399; --danger: #f87171; --warn: #fbbf24;
  }
  [data-theme="light"] {
    --bg: #f4f4f8; --surface: #ffffff; --surface2: #eeeef4;
    --border: #d8d8e4; --text: #1a1a2a; --muted: #7070a0;
    --accent: #7c6af7; --accent2: #6355d4;
    --success: #059669; --danger: #dc2626; --warn: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Login screen ── */
  #loginScreen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #1a1a2e 0%, #0f0f13 100%);
  }
  .login-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 40px 36px; width: 340px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .login-logo { font-size: 22px; font-weight: 700; letter-spacing: 2px; color: var(--accent2); margin-bottom: 4px; }
  .login-sub  { font-size: 12px; color: var(--muted); margin-bottom: 28px; }
  .login-box label { font-size: 11px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
  .login-box input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 14px; color: var(--text); font-size: 14px;
    outline: none; transition: border-color .2s; margin-bottom: 16px;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #9f7aea);
    color: white; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all .2s; letter-spacing: .5px;
  }
  .login-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,106,247,.4); }
  .login-err { color: var(--danger); font-size: 12px; margin-top: 10px; text-align: center; display: none; }

  /* ── App ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 0; z-index: 100;
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: 2px; color: var(--accent2); }
  .logo span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; letter-spacing: 0; }
  .logout-btn {
    padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 12px; cursor: pointer;
    transition: all .2s;
  }
  .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

  .theme-toggle {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface2);
    cursor: pointer; font-size: 16px; display: flex;
    align-items: center; justify-content: center; transition: all .2s;
  }
  .theme-toggle:hover { border-color: var(--accent); }

  .app-body {
    display: grid; grid-template-columns: 340px 1fr;
    flex: 1; height: calc(100vh - 57px);
  }

  /* ── Mobile back button ── */
  .back-btn {
    display: none; padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); font-size: 12px; cursor: pointer;
    transition: all .2s; white-space: nowrap;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .app-body {
      grid-template-columns: 1fr;
      height: auto;
      min-height: calc(100vh - 57px);
    }
    .inbox { height: calc(100vh - 57px); position: relative; }
    .detail { min-height: calc(100vh - 57px); }
    .inbox.mobile-hidden { display: none; }
    .detail.mobile-hidden { display: none; }
    .back-btn { display: inline-flex; }
    .order-info { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .detail-body { flex-direction: column; }
    .detail-header > div:last-child {
      width: 100%; order: 3; display: flex; gap: 8px; flex-wrap: wrap;
    }
    .detail-header .send-agent-btn {
      flex: 1 1 auto; min-width: 120px; font-size: 11px; padding: 8px 10px;
    }
    .detail-header .status-select {
      flex: 1 1 100%; font-size: 11px; padding: 6px 10px;
    }
  }

  /* ── Inbox ── */
  .inbox {
    border-right: 1px solid var(--border); background: var(--surface);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .inbox-header {
    padding: 14px 18px 10px; font-size: 11px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .badge {
    background: var(--accent); color: white; font-size: 10px; font-weight: 700;
    padding: 1px 7px; border-radius: 20px; min-width: 18px; text-align: center;
  }
  .inbox-scroll { overflow-y: auto; flex: 1; }
  .inbox-scroll::-webkit-scrollbar { width: 4px; }
  .inbox-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .order-card {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background .18s; position: relative;
  }
  .order-card:hover { background: var(--surface2); }
  .order-card.active { background: rgba(124,106,247,.1); border-left: 3px solid var(--accent); }
  .order-card.active { padding-left: 15px; }
  .order-name { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .order-meta { font-size: 11px; color: var(--muted); }
  .order-tpl  { font-size: 11px; color: var(--accent2); margin-top: 4px; }
  .order-dot {
    position: absolute; top: 16px; right: 16px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }
  .order-dot.read { display: none; }
  .order-status {
    display: inline-block; margin-top: 5px; padding: 2px 8px;
    border-radius: 20px; font-size: 10px; font-weight: 600;
  }
  .status-new      { background: rgba(124,106,247,.2); color: var(--accent2); }
  .status-revision { background: rgba(251,191,36,.15);  color: var(--warn); }
  .status-done     { background: rgba(52,211,153,.15);  color: var(--success); }

  .inbox-empty {
    padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px;
  }

  /* ── Detail panel ── */
  .detail { display: flex; flex-direction: column; overflow: hidden; }

  .detail-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center;
  }

  .detail-header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .detail-title { font-size: 16px; font-weight: 600; }
  .detail-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .status-select {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 12px; color: var(--text);
    font-size: 12px; outline: none; cursor: pointer;
  }

  .detail-body { display: flex; flex: 1; overflow: hidden; }

  /* Order info */
  .order-info {
    width: 280px; border-right: 1px solid var(--border);
    overflow-y: auto; padding: 20px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 14px;
  }
  .order-info::-webkit-scrollbar { width: 4px; }
  .order-info::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .info-section { }
  .info-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .info-val   { font-size: 13px; color: var(--text); line-height: 1.5; }
  .info-val a { color: var(--accent2); text-decoration: none; }
  .info-val a:hover { text-decoration: underline; }

  .refs-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .ref-mini {
    width: 52px; height: 52px; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border); cursor: pointer;
  }
  .ref-mini img { width: 100%; height: 100%; object-fit: cover; }

  /* Chat / revisions */
  .chat-area {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    max-width: 80%; padding: 10px 14px; border-radius: 12px;
    font-size: 13px; line-height: 1.55;
  }
  .msg-admin {
    background: rgba(124,106,247,.18); border: 1px solid rgba(124,106,247,.3);
    align-self: flex-end; border-bottom-right-radius: 4px; color: var(--text);
  }
  .msg-system {
    background: var(--surface2); border: 1px solid var(--border);
    align-self: flex-start; border-bottom-left-radius: 4px; color: var(--muted);
    font-size: 12px; font-style: italic;
  }
  .msg-time { font-size: 10px; color: var(--muted); margin-top: 4px; text-align: right; }
  .msg-label { font-size: 10px; color: var(--accent2); font-weight: 700; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .8px; }
  .chat-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px; font-style: italic; }

  /* Agent bubbles */
  .msg-agent {
    background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.25);
    align-self: flex-start; border-bottom-left-radius: 4px; color: var(--text);
    max-width: 90%;
  }
  .msg-agent pre { white-space: pre-wrap; word-break: break-word; font-family: inherit; font-size: 13px; }
  .dept-badge {
    display: inline-block; font-size: 9px; letter-spacing: .8px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 3px; font-weight: 700; margin-right: 6px;
  }
  .dept-creative_manager { background: rgba(167,139,250,.15); color: #a78bfa; border: 1px solid rgba(167,139,250,.3); }
  .dept-frontend   { background: rgba(91,155,213,.15); color: #5b9bd5; border: 1px solid rgba(91,155,213,.3); }
  .dept-backend    { background: rgba(91,213,160,.15); color: #5bd5a0; border: 1px solid rgba(91,213,160,.3); }
  .dept-designer   { background: rgba(213,138,58,.15); color: #d58a3a; border: 1px solid rgba(213,138,58,.3); }
  .dept-pr         { background: rgba(213,91,138,.15); color: #d55b8a; border: 1px solid rgba(213,91,138,.3); }
  .dept-content    { background: rgba(138,213,91,.15); color: #8ad55b; border: 1px solid rgba(138,213,91,.3); }
  .agent-spinner { display: inline-block; width: 10px; height: 10px; border: 2px solid rgba(16,185,129,.3); border-top-color: #10b981; border-radius: 50%; animation: spin .7s linear infinite; margin-left: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Global page loader ── */
  #pageLoader {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px;
    background: rgba(15,15,19,.85);
    backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  #pageLoader.visible { opacity: 1; pointer-events: all; }
  .pl-ring {
    width: 52px; height: 52px; border-radius: 50%;
    border: 3px solid rgba(124,106,247,.15);
    border-top-color: #7c6af7;
    border-right-color: #a78bfa;
    animation: spin .9s cubic-bezier(.4,0,.2,1) infinite;
  }
  .pl-dots {
    display: flex; gap: 6px;
  }
  .pl-dots span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent2); opacity: .3;
    animation: plDot 1.2s ease-in-out infinite;
  }
  .pl-dots span:nth-child(2) { animation-delay: .2s; }
  .pl-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes plDot { 0%,80%,100%{opacity:.3;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }
  .pl-label {
    font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
  }

  /* Agent send row */
  .agent-send-row {
    border-top: 1px solid var(--border); padding: 10px 20px;
    background: var(--surface); display: flex; gap: 8px; align-items: center; flex-shrink: 0;
  }
  .agent-select {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; font-family: inherit;
    outline: none; cursor: pointer; flex-shrink: 0;
  }
  .agent-select:focus { border-color: var(--accent); }
  .send-agent-btn {
    padding: 8px 14px; border: none; border-radius: 8px; flex-shrink: 0;
    background: rgba(16,185,129,.2); border: 1px solid rgba(16,185,129,.35);
    color: #10b981; font-size: 12px; font-weight: 700; cursor: pointer; transition: all .2s;
  }
  .send-agent-btn:hover { background: rgba(16,185,129,.3); }
  .send-agent-btn:disabled { opacity: .4; cursor: not-allowed; }

  .chat-input-area {
    border-top: 1px solid var(--border); padding: 16px 20px;
    background: var(--surface); flex-shrink: 0;
    display: flex; gap: 10px; align-items: flex-end;
  }
  .chat-input-area textarea {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text);
    font-size: 13px; font-family: inherit; resize: none; outline: none;
    transition: border-color .2s; min-height: 44px; max-height: 120px;
  }
  .chat-input-area textarea:focus { border-color: var(--accent); }
  .send-revision-btn {
    padding: 10px 18px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #9f7aea);
    color: white; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: all .2s; white-space: nowrap; flex-shrink: 0;
  }
  .send-revision-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,106,247,.4); }
  .send-revision-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.88);
    z-index: 300; display: none; align-items: center; justify-content: center;
  }
  .lightbox.open { display: flex; }
  .lightbox img  { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
  .lb-close {
    position: absolute; top: 20px; right: 28px;
    font-size: 28px; cursor: pointer; color: white; opacity: .6;
    transition: opacity .2s;
  }
  .lb-close:hover { opacity: 1; }

  /* Debug modal */
  .debug-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.82);
    z-index: 400; display: none; align-items: flex-start; justify-content: center;
    padding: 40px 20px; overflow-y: auto;
  }
  .debug-modal.open { display: flex; }
  .debug-box {
    background: #0d0d14; border: 1px solid var(--border);
    border-radius: 12px; width: 100%; max-width: 720px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6); flex-shrink: 0;
  }
  .debug-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--accent2);
    text-transform: uppercase;
  }
  .debug-actions { display: flex; gap: 8px; }
  .debug-copy-btn {
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted); font-size: 11px;
    cursor: pointer; transition: all .2s;
  }
  .debug-copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .debug-close {
    font-size: 18px; cursor: pointer; color: var(--muted);
    transition: color .2s; line-height: 1;
  }
  .debug-close:hover { color: var(--text); }
  .debug-body {
    padding: 20px; overflow-x: auto;
    font-family: 'Courier New', monospace; font-size: 12px;
    line-height: 1.7; color: #a8d8a8; white-space: pre;
    max-height: 70vh; overflow-y: auto;
  }
  .debug-body::-webkit-scrollbar { width: 4px; height: 4px; }
  .debug-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 22px; font-size: 13px; font-weight: 500;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index: 999; min-width: 240px; text-align: center;
  }
  .toast.show    { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--success); color: var(--success); }
  .toast.error   { border-color: var(--danger);  color: var(--danger); }
</style>
</head>
<body>

<!-- Global loader -->
<div id="pageLoader">
  <div class="pl-ring"></div>
  <div class="pl-dots"><span></span><span></span><span></span></div>
  <div class="pl-label" id="plLabel">Загрузка…</div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lb"><span class="lb-close" id="lbClose">✕</span><img id="lbImg" src="" alt=""></div>
<div class="toast" id="toast"></div>

<!-- Debug modal -->
<div class="debug-modal" id="debugModal">
  <div class="debug-box">
    <div class="debug-header">
      🐛 Debug — JSON заявки
      <div class="debug-actions">
        <button class="debug-copy-btn" id="debugCopyBtn">📋 Копировать</button>
        <span class="debug-close" id="debugClose">✕</span>
      </div>
    </div>
    <div class="debug-body" id="debugBody"></div>
  </div>
</div>

<!-- ── Login ── -->
<!-- ── App ── -->
<div id="app">
  <header>
    <div class="logo">IN_SITE <span>admin</span></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="theme-toggle" id="themeToggle" title="Сменить тему">🌙</button>
      <button class="logout-btn" id="logoutBtn">Выйти</button>
    </div>
  </header>

  <div class="app-body">
    <div class="inbox">
      <div class="inbox-header">
        Входящие заявки
        <span class="badge" id="unreadBadge">0</span>
      </div>
      <div class="inbox-scroll" id="inboxList">
        <div class="inbox-empty">Заявок пока нет.<br>Они появятся после отправки клиентом.</div>
      </div>
    </div>
    <div class="detail" id="detail">
      <div class="detail-empty">
        <div>
          <div style="font-size:36px;opacity:.3;margin-bottom:12px;">📋</div>
          Выберите заявку слева
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── Loader ──
let _loaderCount = 0, _loaderTimer = null;
const _loader = () => document.getElementById('pageLoader');
const _plLabel = () => document.getElementById('plLabel');
function showLoader(label) {
  _loaderCount++;
  if (_loaderTimer) { clearTimeout(_loaderTimer); _loaderTimer = null; }
  if (_plLabel()) _plLabel().textContent = label || 'Загрузка…';
  if (_loader()) _loader().classList.add('visible');
}
function hideLoader() {
  _loaderCount = Math.max(0, _loaderCount - 1);
  if (_loaderCount === 0) {
    _loaderTimer = setTimeout(() => { if (_loader()) _loader().classList.remove('visible'); }, 180);
  }
}
// Auto-intercept slow fetches (>300ms show loader)
const _origFetch = window.fetch;
window.fetch = function(...args) {
  const url = typeof args[0] === 'string' ? args[0] : (args[0]?.url || '');
  const isApi = url.includes('/insite/') || url.includes('/webhook/') || url.includes('bendernostur');
  let timer = null;
  if (isApi) timer = setTimeout(() => showLoader(), 300);
  return _origFetch.apply(this, args).finally(() => {
    if (timer) clearTimeout(timer);
    if (isApi) hideLoader();
  });
};

// ── Theme ──
const THEME_KEY = 'insite_theme';
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = t === 'light' ? '☀️' : '🌙';
}
const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
applyTheme(savedTheme);
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});

// ── Mobile nav ──
function showInbox() {
  document.querySelector('.inbox').classList.remove('mobile-hidden');
  document.getElementById('detail').classList.add('mobile-hidden');
}
function showDetail() {
  if (window.innerWidth <= 768) {
    document.querySelector('.inbox').classList.add('mobile-hidden');
    document.getElementById('detail').classList.remove('mobile-hidden');
  }
}

async function getOrders() {
  try {
    const res = await fetch(`${API_BASE}/orders`, {
      headers: { 'Authorization': 'Basic ' + btoa(`root:${CREDS.pass}`) }
    });
    if (!res.ok) return [];
    return await res.json();
  } catch { return []; }
}
function getRevisions(orderId) {
  try {
    const all = JSON.parse(localStorage.getItem(REVS_KEY) || '{}');
    return all[orderId] || [];
  } catch { return []; }
}
function saveRevision(orderId, text) {
  try {
    const all = JSON.parse(localStorage.getItem(REVS_KEY) || '{}');
    if (!all[orderId]) all[orderId] = [];
    all[orderId].push({ text, ts: new Date().toISOString() });
    localStorage.setItem(REVS_KEY, JSON.stringify(all));
  } catch {}
}

async function renderInbox() {
  const orders = await getOrders();
  const list = document.getElementById('inboxList');
  const badge = document.getElementById('unreadBadge');
  const unread = orders.filter(o => !o.read).length;
  badge.textContent = unread;
  badge.style.display = unread ? 'inline-block' : 'none';

  if (!orders.length) {
    list.innerHTML = '<div class="inbox-empty">Заявок пока нет.<br>Они появятся после отправки клиентом.</div>';
    return;
  }

  list.innerHTML = '';
  [...orders].reverse().forEach(order => {
    const card = document.createElement('div');
    card.className = 'order-card' + (order.id === activeOrderId ? ' active' : '');
    const statusMap = { new: 'status-new', revision: 'status-revision', done: 'status-done' };
    const statusLabel = { new: 'Новая', revision: 'В правках', done: 'Готово' };
    card.innerHTML = `

      '',
      // === СПЕЦИФИКА СОБЫТИЯ (если это свадьба/праздник) ===
      ord.wedding_date ? `Дата события: ${ord.wedding_date}` : '',
      ord.venue ? `Площадка: ${ord.venue}` : '',
      ord.guest_count ? `Количество гостей: ${ord.guest_count}` : '',
      ord.dresscode ? `Дресс-код: ${ord.dresscode}` : '',
      '',
      // === МАТЕРИАЛЫ И РЕФЕРЕНСЫ ===
      ord.references?.length ? `Загруженные референсы: ${ord.references.length} изображений\n(Клиент предоставил примеры стиля, который ему нравится)` : 'Референсы не загружены',
    ].filter(Boolean).join('\n');
    try {
      const res = await fetch('https://bendernostur.duckdns.org:88/webhook/insite/task', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          // Agent command and context
          department: dept,
          system_prompt: SYSTEM_PROMPT,
          task,
          order_id: ord.id,

          // Full original order object (untruncated) for reference
          order: ord,

          // Split context into multiple fields to prevent truncation
          client_info: `${clientTypeLabel}\nКлиент: ${ord.couple_names || ord.client_name || ord.event_name || '—'}\nEmail: ${ord.client_email || '—'}`,
          project_details: `Тип проекта: ${ord.project_type || 'не указан'}\nШаблон: ${(ord.template||{}).name || '—'}\nНиша: ${ord.niche || 'не указана'}\nБюджет: ${ord.budget || 'не указан'}\nДедлайн: ${ord.deadline || 'гибкий'}`,
          design_specs: `Стиль: ${(ord.template||{}).vibe || '—'}\nПалитра: ${ord.color_palette?.name || 'шаблонная'}\nИнтро: ${INTRO_LABELS[ord.intro] || ord.intro || 'нет'}\nШрифт: ${ord.font || 'стандартный'}`,
          site_content_about: ord.about_text ? `ТЕКСТ ДЛЯ САЙТА (О нас — вставить на страницу, НЕ определяет тип проекта): ${ord.about_text}` : '',
          full_task_description: `ПОЖЕЛАНИЯ ПО ДИЗАЙНУ: ${ord.task_description || ord.style_notes || 'Не указаны'}`,
          additional_wishes: ord.extra_notes || '',
          event_details: [
            ord.wedding_date ? `Дата: ${ord.wedding_date}` : '',
            ord.venue ? `Площадка: ${ord.venue}` : '',
            ord.guest_count ? `Гостей: ${ord.guest_count}` : '',
            ord.dresscode ? `Дресс-код: ${ord.dresscode}` : ''
          ].filter(Boolean).join(', '),
          references_count: ord.references?.length || 0,

          // Keep original concatenated context as backup
          context: `E-T-E LABORATORY — IN_SITE Studio.\n${clientTypeLabel}\nЗаявка #${ord.id}:\n\n${orderContext}`,
        }),
      });
      const raw = await res.json();
      const items = Array.isArray(raw) ? raw : [raw];
      const notes = items.map(item => ({
        department: item.department || dept, model: item.model || '',
        text: item.result || item.text || item.output || JSON.stringify(item),
        ts: new Date().toISOString(),
      })).filter(n => n.text);
      if (notes.length) {
        await fetch(`${API_BASE}/orders/${ord.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + btoa(`root:${CREDS.pass}`) },
          body: JSON.stringify({ agent_notes: notes }),
        });
      }
      agentTaskEl.value = '';
    } catch (e) { showToast('Ошибка агента: ' + e.message, 'error'); }
    btn.disabled = false; btn.textContent = '▶ Агент';
    const freshOrders = await getOrders();
    renderDetail(freshOrders.find(x => x.id === ord.id) || ord);
    renderInbox();
  }

  setTimeout(() => {
    const cm = document.getElementById('chatMessages');
    if (cm) cm.scrollTop = cm.scrollHeight;
  }, 50);

  // ── Debug button ──
  document.getElementById('debugBtn').addEventListener('click', () => {
    document.getElementById('debugBody').textContent = JSON.stringify(order, null, 2);
    document.getElementById('debugModal').classList.add('open');
  });

  // ── Redesign button ──
  document.getElementById('redesignBtn').addEventListener('click', async () => {
    const btn = document.getElementById('redesignBtn');
    btn.disabled = true; btn.textContent = '⏳ Redesign…'; showLoader('Генерирую редизайн…');
    const brief = [
      `REDESIGN: создай АЛЬТЕРНАТИВНЫЙ вариант сайта с другим визуальным стилем.`,
      `Клиент: ${order.couple_names || order.client_name || order.event_name || '—'}`,
      order.niche ? `Ниша: ${order.niche}` : '',
      `Шаблон/стиль: ${(order.template||{}).name || '—'}`,
      order.color_palette?.name ? `Исходная палитра: ${order.color_palette.name} — выбери другую` : '',
      order.budget ? `Бюджет: ${order.budget}` : '',
      order.task_description || order.style_notes ? `Задача: ${order.task_description || order.style_notes}` : '',
      order.extra_notes ? `Пожелания: ${order.extra_notes}` : '',
      order.client_email ? `Контакт: ${order.client_email}` : '',
      `Сделай другую цветовую гамму, другую типографику и другую компоновку секций.`,
    ].filter(Boolean).join('\n');
    try {
      const res = await fetch(`${API_BASE}/build`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Basic ' + btoa(`root:${CREDS.pass}`) },
        body: JSON.stringify({ order_id: order.id + '_r' + Date.now().toString(36), brief, link_to: order.id }),
      });
      const d = await res.json();
      if (d.ok) {
        showToast('✨ Redesign готов', 'success');
        window.open(d.url, '_blank');
      } else {
        showToast('Ошибка: ' + (d.error || 'не удалось'), 'error');
      }
    } catch (e) {
      showToast('Ошибка сети: ' + e.message, 'error');
    }
    btn.disabled = false; btn.textContent = '✨ Redesign';
  });
}

// ── Debug modal global handlers ──
document.getElementById('debugClose').addEventListener('click', () => {
  document.getElementById('debugModal').classList.remove('open');
});
document.getElementById('debugModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});
document.getElementById('debugCopyBtn').addEventListener('click', () => {
  const text = document.getElementById('debugBody').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('debugCopyBtn');
    btn.textContent = '✓ Скопировано';
    setTimeout(() => btn.textContent = '📋 Копировать', 1800);
  });
});

function infoRow(label, val) {
  if (!val) return '';
  return `<div class="info-section">
    <div class="info-label">${label}</div>
    <div class="info-val">${esc(String(val)).replace(/\n/g,'<br>')}</div>
  </div>`;
}

function openLb(src) {
  document.getElementById('lbImg').src = src;
  document.getElementById('lb').classList.add('open');
}
document.getElementById('lbClose').addEventListener('click', () => document.getElementById('lb').classList.remove('open'));
document.getElementById('lb').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type;
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => t.classList.remove('show'), 3500);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'short' }) + ' ' +
           d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
  } catch { return iso; }
}
</script>
